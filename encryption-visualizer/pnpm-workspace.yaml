packages:
  - "."

# core-js's postinstall only prints a funding banner, so its build stays off.
# pnpm 12 refuses to install while a build script is unclassified.
allowBuilds:
  core-js: false

# Dependency floors that close advisories in transitive packages. These moved
# out of package.json's pnpm.overrides, which pnpm stopped reading in v10.
overrides:
  "workbox-build@7.4.1>glob": "14.0.6"
  picomatch: "^4.0.4"
  "minimatch@>=7 <11.0.1": "11.0.5"
  protobufjs: "^7.6.1"
  serialize-javascript: ">=7.0.3 <8"
  browserslist: ">=4.28.7 <5"
  esbuild: ">=0.28.1 <1"
  fast-uri: ">=3.1.8 <4.0.0"
  postcss-selector-parser: ">=6.1.5 <7"

# Keep accessibility rules compatible with ESLint 10.
patchedDependencies:
  eslint-plugin-jsx-a11y@6.10.2: patches/eslint-plugin-jsx-a11y@6.10.2.patch
