name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - run: cd encryption-visualizer && pnpm install --frozen-lockfile
      - run: cd encryption-visualizer && pnpm run lint
      - run: cd encryption-visualizer && pnpm run test:run
      - run: cd encryption-visualizer && pnpm run build
