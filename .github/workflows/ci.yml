name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          run_install: false
      - run: cd encryption-visualizer && pnpm install --frozen-lockfile
      - run: cd encryption-visualizer && pnpm run lint
      - run: cd encryption-visualizer && pnpm run test:run
      - run: cd encryption-visualizer && pnpm run build
